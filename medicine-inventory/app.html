<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qubit | Medicine Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-oled: #000000;
            --bg-panel: #0a0a0a;
            --bg-card: #121212;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-oled);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- Header --- */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;
        }
        .brand { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .brand span { color: var(--primary); }
        
        .user-controls { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; }
        .logout-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { background: var(--bg-card); border-color: var(--text-muted); }

        /* --- Layout Grid --- */
        .dashboard-layout { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 850px) { .dashboard-layout { grid-template-columns: 360px 1fr; } }

        /* --- Forms & Panels --- */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; }
        .panel-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; }

        .form-group { margin-bottom: 1.25rem; position: relative; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .form-group input {
            width: 100%; padding: 0.75rem 1rem; background-color: var(--bg-oled);
            border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
            font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        
        /* --- Smart Autocomplete Dropdown --- */
        .autocomplete-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 8px; margin-top: 4px;
            max-height: 200px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .autocomplete-dropdown.hidden { display: none; }
        .autocomplete-item {
            padding: 0.75rem 1rem; cursor: pointer; font-size: 0.9rem; display: flex; flex-direction: column;
            border-bottom: 1px solid var(--border-color); transition: background-color 0.15s;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background-color: var(--primary); color: white; }
        
        .ac-header { display: flex; justify-content: space-between; align-items: center; }
        .ac-brand { font-weight: 600; text-transform: capitalize; }
        .ac-type { font-size: 0.7rem; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; text-transform: uppercase; }
        .ac-salt { font-size: 0.75rem; color: var(--text-muted); text-transform: capitalize; margin-top: 2px; }
        .ac-mfg { font-size: 0.7rem; color: #a1a1aa; margin-top: 4px; }
        
        .autocomplete-item:hover .ac-salt, .autocomplete-item:hover .ac-mfg { color: rgba(255,255,255,0.8); }

        /* --- Med Type Selectors --- */
        .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        .type-radio { display: none; }
        .type-label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem; padding: 0.5rem; background-color: var(--bg-oled); border: 1px solid var(--border-color);
            border-radius: 8px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-size: 0.75rem;
        }
        .type-label:hover { border-color: var(--text-muted); color: var(--text-main); }
        .type-radio:checked + .type-label {
            border-color: var(--primary); background-color: rgba(37, 99, 235, 0.1); color: var(--primary);
        }

        .btn-primary {
            width: 100%; background-color: var(--primary); color: white; border: none;
            padding: 0.85rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        /* --- Inventory Header & Search --- */
        .inventory-header {
            display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;
        }
        @media(min-width: 640px) {
            .inventory-header { flex-direction: row; justify-content: space-between; align-items: flex-end; }
        }
        .search-box {
            position: relative; width: 100%; max-width: 350px;
        }
        .search-box input {
            width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem; background-color: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
            font-size: 0.9rem; transition: border-color 0.2s;
        }
        .search-box input:focus { outline: none; border-color: var(--primary); }
        .search-box svg {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); pointer-events: none;
        }

        /* --- Medicine Grid & Cards --- */
        .medicine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
        
        .med-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1.25rem; display: flex; flex-direction: column; position: relative; transition: transform 0.2s;
            border-left: 4px solid var(--border-color); /* Status Indicator Default */
        }
        .med-card:hover { border-color: #333333; }

        .med-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        
        .med-identity { display: flex; align-items: flex-start; gap: 0.75rem; }
        .med-icon { 
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            background-color: rgba(255,255,255,0.05); border-radius: 8px; color: var(--primary); flex-shrink: 0;
        }
        .med-brand-text { font-size: 1.05rem; font-weight: 600; word-break: break-word; line-height: 1.2; text-transform: capitalize; }
        .med-salt-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; text-transform: capitalize; line-height: 1.3; }
        .med-mfg-text { font-size: 0.75rem; color: #6366f1; margin-top: 0.35rem; font-weight: 500; }
        
        .med-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
        .med-actions button:hover { color: var(--danger); }

        .med-details { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; margin-top: 0.5rem; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; min-height: 24px; }
        .badge { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid transparent; }
        .badge.danger { background-color: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
        .badge.warning { background-color: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
        .badge.success { background-color: rgba(16, 185, 129, 0.1); color: var(--success); border-color: var(--success); }

        .qty-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-oled); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.25rem;
        }
        .qty-btn {
            background: var(--bg-panel); border: none; color: var(--text-main); width: 32px; height: 32px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .qty-btn:hover { background: #222222; }
        .qty-display { font-weight: 600; font-size: 0.95rem; }

        #loader { text-align: center; color: var(--text-muted); padding: 2rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        <header class="app-header">
            <div class="brand">Qubit <span>| Inventory</span></div>
            <div class="user-controls">
                <span id="user-email">Loading...</span>
                <button id="logout-btn" class="logout-btn">Sign Out</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <aside>
                <div class="panel">
                    <h2 class="panel-title">Add New Medicine</h2>
                    <form id="add-medicine-form" autocomplete="off">
                        
                        <div class="form-group">
                            <label for="med-brand">Trade / Generic Name</label>
                            <input type="text" id="med-brand" placeholder="e.g., Azithromycin or Xyzal" required>
                            <div id="autocomplete-results" class="autocomplete-dropdown hidden"></div>
                        </div>

                        <div class="form-group">
                            <label>Medicine Type (Auto-detected)</label>
                            <div class="type-grid">
                                <div>
                                    <input type="radio" name="med-type" id="type-pill" value="pill" class="type-radio" checked>
                                    <label for="type-pill" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><line x1="7.05" y1="12" x2="16.95" y2="12"></line></svg>
                                        Tablet
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="med-type" id="type-capsule" value="capsule" class="type-radio">
                                    <label for="type-capsule" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="6" rx="3" transform="rotate(-45 12 13)"></rect><path d="M7 10l5 5"></path></svg>
                                        Capsule
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="med-type" id="type-liquid" value="liquid" class="type-radio">
                                    <label for="type-liquid" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v3h4V2z"></path><rect x="7" y="5" width="10" height="17" rx="3"></rect><path d="M7 12h10"></path></svg>
                                        Syrup
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="med-type" id="type-drops" value="drops" class="type-radio">
                                    <label for="type-drops" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>
                                        Drops
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="med-type" id="type-inhaler" value="inhaler" class="type-radio">
                                    <label for="type-inhaler" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21v-5a3 3 0 0 1 3-3h1"></path><path d="M16 13h2a3 3 0 0 1 3 3v5"></path><path d="M16 3h-5a3 3 0 0 0-3 3v7h8V6a3 3 0 0 0-3-3z"></path></svg>
                                        Inhaler
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="med-type" id="type-ointment" value="ointment" class="type-radio">
                                    <label for="type-ointment" class="type-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-2 5H8z"></path><path d="M8 8v11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8"></path></svg>
                                        Cream
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="med-salts">Formulation / Salts</label>
                            <input type="text" id="med-salts" placeholder="e.g., Azithromycin">
                        </div>
                        
                        <div class="form-group">
                            <label for="med-mfg">Manufacturer</label>
                            <input type="text" id="med-mfg" placeholder="e.g., Pfizer">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="med-qty">Current Qty</label>
                                <input type="number" id="med-qty" placeholder="30" min="0" required>
                            </div>
                            <div class="form-group">
                                <label for="med-exp">Expiry Date</label>
                                <input type="date" id="med-exp" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="submit-btn">Add to Inventory</button>
                    </form>
                </div>
            </aside>

            <main>
                <div class="inventory-header">
                    <div>
                        <h2 class="panel-title" style="margin-bottom: 0;">Available Stock</h2>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;" id="inventory-count">Loading...</div>
                    </div>
                    <div class="search-box">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="inventory-search" placeholder="Search brand, salt, type...">
                    </div>
                </div>

                <div class="medicine-grid" id="medicine-grid">
                    <div id="loader">Syncing with Qubit Cloud...</div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdavvZjFC1xo3reedoJyecBJCFXyo7vIM",
            authDomain: "my-qubit.firebaseapp.com",
            projectId: "my-qubit",
            storageBucket: "my-qubit.firebasestorage.app",
            messagingSenderId: "68819998084",
            appId: "1:68819998084:web:02ff7dd40e78659ea1f9d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let localInventory = []; // Local memory for instant searching

        const grid = document.getElementById('medicine-grid');
        const addForm = document.getElementById('add-medicine-form');
        const medBrandInput = document.getElementById('med-brand');
        const medSaltsInput = document.getElementById('med-salts');
        const medMfgInput = document.getElementById('med-mfg');
        const searchInput = document.getElementById('inventory-search');
        const autocompleteResults = document.getElementById('autocomplete-results');
        
        let debounceTimer;

        const icons = {
            pill: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><line x1="7.05" y1="12" x2="16.95" y2="12"></line></svg>`,
            capsule: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="6" rx="3" transform="rotate(-45 12 13)"></rect><path d="M7 10l5 5"></path></svg>`,
            liquid: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v3h4V2z"></path><rect x="7" y="5" width="10" height="17" rx="3"></rect><path d="M7 12h10"></path></svg>`,
            drops: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>`,
            inhaler: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21v-5a3 3 0 0 1 3-3h1"></path><path d="M16 13h2a3 3 0 0 1 3 3v5"></path><path d="M16 3h-5a3 3 0 0 0-3 3v7h8V6a3 3 0 0 0-3-3z"></path></svg>`,
            ointment: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-2 5H8z"></path><path d="M8 8v11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8"></path></svg>`
        };

        // --- SMART TYPE MAPPING ---
        function detectMedicineType(description) {
            if (!description) return 'pill';
            const desc = description.toLowerCase();
            if (desc.includes('cap')) return 'capsule';
            if (desc.includes('syr') || desc.includes('sol') || desc.includes('liq') || desc.includes('susp') || desc.includes('elix')) return 'liquid';
            if (desc.includes('drop')) return 'drops';
            if (desc.includes('inh') || desc.includes('aer') || desc.includes('spray')) return 'inhaler';
            if (desc.includes('oint') || desc.includes('crea') || desc.includes('gel') || desc.includes('lot')) return 'ointment';
            return 'pill';
        }

        medBrandInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (query.length < 2) {
                autocompleteResults.innerHTML = '';
                autocompleteResults.classList.add('hidden');
                return;
            }
            debounceTimer = setTimeout(() => fetchDualSuggestions(query), 300);
        });

        async function fetchDualSuggestions(searchQuery) {
            try {
                const [fdaRes, nihRes] = await Promise.allSettled([
                    fetch(`https://api.fda.gov/drug/ndc.json?search=brand_name:"${searchQuery}*"&limit=10`),
                    fetch(`https://clinicaltables.nlm.nih.gov/api/rxterms/v3/search?terms=${searchQuery}`)
                ]);

                let rawSuggestions = [];

                if (fdaRes.status === 'fulfilled' && fdaRes.value.ok) {
                    const fdaData = await fdaRes.value.json();
                    if (fdaData.results) {
                        fdaData.results.forEach(drug => {
                            if (drug.brand_name) {
                                rawSuggestions.push({
                                    brand: drug.brand_name.toLowerCase(),
                                    salt: drug.generic_name ? drug.generic_name.toLowerCase() : '',
                                    mfg: drug.labeler_name ? drug.labeler_name : '',
                                    typeStr: drug.dosage_form ? drug.dosage_form.join(' ') : ''
                                });
                            }
                        });
                    }
                }

                if (nihRes.status === 'fulfilled' && nihRes.value.ok) {
                    const nihData = await nihRes.value.json();
                    const names = nihData[1];
                    if (names) {
                        names.forEach(name => {
                            rawSuggestions.push({ brand: name.toLowerCase(), salt: '', mfg: '', typeStr: name });
                        });
                    }
                }

                const uniqueSuggestions = [];
                const seenBrands = new Set();
                
                rawSuggestions.forEach(item => {
                    const key = item.brand + (item.mfg || ''); 
                    if (!seenBrands.has(key)) {
                        seenBrands.add(key);
                        item.mappedType = detectMedicineType(item.typeStr);
                        uniqueSuggestions.push(item);
                    }
                });

                if (uniqueSuggestions.length === 0) {
                    autocompleteResults.classList.add('hidden');
                    return;
                }

                autocompleteResults.innerHTML = '';
                uniqueSuggestions.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    
                    const mfgDisplay = item.mfg ? `<div class="ac-mfg">Mfg: ${item.mfg}</div>` : '';
                    const saltDisplay = item.salt ? `<div class="ac-salt">${item.salt}</div>` : '';

                    div.innerHTML = `
                        <div class="ac-header">
                            <span class="ac-brand">${item.brand}</span>
                            <span class="ac-type">${item.mappedType}</span>
                        </div>
                        ${saltDisplay}
                        ${mfgDisplay}
                    `;
                    
                    div.onclick = () => {
                        medBrandInput.value = item.brand.replace(/\b\w/g, c => c.toUpperCase());
                        const finalSalt = item.salt || item.brand;
                        medSaltsInput.value = finalSalt.replace(/\b\w/g, c => c.toUpperCase());
                        if(item.mfg) medMfgInput.value = item.mfg;
                        
                        const targetRadio = document.querySelector(`input[value="${item.mappedType}"]`);
                        if(targetRadio) targetRadio.checked = true;

                        autocompleteResults.classList.add('hidden');
                    };
                    autocompleteResults.appendChild(div);
                });
                autocompleteResults.classList.remove('hidden');
            } catch (error) {
                autocompleteResults.classList.add('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            if (!medBrandInput.contains(e.target) && !autocompleteResults.contains(e.target)) {
                autocompleteResults.classList.add('hidden');
            }
        });

        // 1. Auth & Data Sync
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-email').textContent = user.email;
                fetchMedicines();
            } else {
                window.location.href = 'login.html';
            }
        });

        function fetchMedicines() {
            const medicinesRef = collection(db, 'users', currentUser.uid, 'medicines');
            const q = query(medicinesRef, orderBy('createdAt', 'desc'));

            onSnapshot(q, (snapshot) => {
                localInventory = []; // Clear local copy
                snapshot.forEach(docSnap => {
                    localInventory.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderInventory(); // Render the full list
            });
        }

        // --- NEW: INSTANT LOCAL SEARCH ---
        searchInput.addEventListener('input', (e) => {
            renderInventory(e.target.value);
        });

        function renderInventory(filterText = '') {
            grid.innerHTML = '';
            
            if (localInventory.length === 0) {
                grid.innerHTML = '<div id="loader">Your inventory is empty.</div>';
                document.getElementById('inventory-count').textContent = '0 items tracked';
                return;
            }

            const lowerFilter = filterText.toLowerCase();
            
            // Filter array based on multiple fields
            const filtered = localInventory.filter(item => {
                if (!filterText) return true;
                const brand = (item.brand || item.name || '').toLowerCase();
                const salts = (item.salts || '').toLowerCase();
                const type = (item.type || '').toLowerCase();
                const mfg = (item.manufacturer || '').toLowerCase();
                
                return brand.includes(lowerFilter) || salts.includes(lowerFilter) || type.includes(lowerFilter) || mfg.includes(lowerFilter);
            });

            document.getElementById('inventory-count').textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''} found`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div id="loader">No matching medicines found.</div>';
                return;
            }

            filtered.forEach(data => renderCard(data.id, data));
        }

        // 2. Render Cards with Dynamic Borders
        function renderCard(id, data) {
            const card = document.createElement('div');
            card.className = 'med-card';

            const qty = parseInt(data.quantity);
            const expDate = new Date(data.expiryDate);
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            expDate.setHours(0, 0, 0, 0);
            const daysToExpiry = Math.ceil((expDate - today) / (1000 * 3600 * 24));

            let badgesHTML = '';
            let statusColor = 'var(--success)'; // Default to healthy green
            
            if (qty < 5 || daysToExpiry < 0) {
                statusColor = 'var(--danger)';
            } else if (daysToExpiry <= 30) {
                statusColor = 'var(--warning)';
            }

            // Apply dynamic border
            card.style.borderLeftColor = statusColor;

            if (qty < 5) badgesHTML += `<span class="badge danger">Low Stock (${qty})</span>`;
            if (daysToExpiry < 0) badgesHTML += `<span class="badge danger">Expired</span>`;
            else if (daysToExpiry <= 30) badgesHTML += `<span class="badge warning">Expiring in ${daysToExpiry} days</span>`;
            else badgesHTML += `<span class="badge success">Stock Healthy</span>`;

            const medIcon = icons[data.type] || icons['pill'];
            const displayBrand = data.brand || data.name || 'Unknown';
            const displaySalt = (data.salts && data.salts.toLowerCase() !== displayBrand.toLowerCase()) 
                                ? `<div class="med-salt-text">${escapeHTML(data.salts)}</div>` : '';
            const displayMfg = data.manufacturer ? `<div class="med-mfg-text">By ${escapeHTML(data.manufacturer)}</div>` : '';

            card.innerHTML = `
                <div class="med-header">
                    <div class="med-identity">
                        <div class="med-icon">${medIcon}</div>
                        <div>
                            <div class="med-brand-text">${escapeHTML(displayBrand)}</div>
                            ${displaySalt}
                            ${displayMfg}
                        </div>
                    </div>
                    <div class="med-actions">
                        <button onclick="deleteMedicine('${id}')" title="Delete">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="badge-container">${badgesHTML}</div>
                <div class="med-details">
                    <div>Expires: <strong>${formatDate(data.expiryDate)}</strong></div>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQuantity('${id}', ${qty}, -1)">-</button>
                    <span class="qty-display">${qty}</span>
                    <button class="qty-btn" onclick="updateQuantity('${id}', ${qty}, 1)">+</button>
                </div>
            `;
            grid.appendChild(card);
        }

        // 3. Database Operations
        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Adding...';
            btn.disabled = true;

            const brand = document.getElementById('med-brand').value;
            const salts = document.getElementById('med-salts').value;
            const mfg = document.getElementById('med-mfg').value;
            const qty = document.getElementById('med-qty').value;
            const exp = document.getElementById('med-exp').value;
            const type = document.querySelector('input[name="med-type"]:checked').value;

            try {
                const medicinesRef = collection(db, 'users', currentUser.uid, 'medicines');
                await addDoc(medicinesRef, {
                    brand: brand,
                    salts: salts,
                    manufacturer: mfg,
                    quantity: parseInt(qty),
                    expiryDate: exp,
                    type: type,
                    createdAt: serverTimestamp()
                });
                
                medBrandInput.value = '';
                medSaltsInput.value = '';
                medMfgInput.value = '';
                document.getElementById('med-qty').value = '';
                document.getElementById('med-exp').value = '';
                document.getElementById('type-pill').checked = true;
                autocompleteResults.classList.add('hidden'); 
            } catch (error) {
                alert("Failed to add medicine.");
            } finally {
                btn.textContent = 'Add to Inventory';
                btn.disabled = false;
            }
        });

        window.updateQuantity = async (id, currentQty, change) => {
            const newQty = currentQty + change;
            if (newQty < 0) return; 
            await updateDoc(doc(db, 'users', currentUser.uid, 'medicines', id), { quantity: newQty });
        };

        window.deleteMedicine = async (id) => {
            if (!confirm("Remove this item from your inventory?")) return;
            await deleteDoc(doc(db, 'users', currentUser.uid, 'medicines', id));
        };

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'login.html');
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
