<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compiling Report - Qubit Meds</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        brand: '#0a84ff', 
                        dark: { bg: '#000000', card: '#121212', border: '#27272a' } 
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-dark-bg text-white h-screen flex flex-col items-center justify-center overflow-hidden font-sans selection:bg-brand/30">

    <div class="flex flex-col items-center justify-center space-y-6 z-10 relative">
        <div class="relative flex items-center justify-center w-20 h-20">
            <!-- Glowing background pulse -->
            <div class="absolute inset-0 bg-brand/20 rounded-full blur-xl animate-pulse"></div>
            <!-- Icon Card -->
            <div class="w-16 h-16 rounded-2xl bg-dark-card border border-white/10 shadow-2xl flex items-center justify-center relative overflow-hidden z-10 animate-bounce" style="animation-duration: 2s;">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" class="text-brand relative z-10" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path>
                    <polyline stroke-linecap="round" stroke-linejoin="round" points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline stroke-linecap="round" stroke-linejoin="round" points="7 3 7 8 15 8"></polyline>
                </svg>
            </div>
            <!-- Loading Spinner -->
            <svg class="animate-spin absolute w-24 h-24 text-brand/40" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <div class="text-center">
            <h2 class="text-xl font-bold tracking-tight text-white mb-1">Generating Inventory Report</h2>
            <p class="text-sm text-zinc-500 font-medium">Compiling medical data and evaluating expiry statuses...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawData = localStorage.getItem('qubit_export_cache');
            if (!rawData) {
                alert("No inventory data found. Returning to Qubit.");
                window.history.back();
                return;
            }

            const inventory = JSON.parse(rawData);
            
            // --- 1. Independent Data Categorization ---
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const expiredMeds = [];
            const lowStockMeds = [];
            const expiringMeds = [];
            const healthyMeds = [];
            
            inventory.forEach(med => {
                const expDate = new Date(med.expiryDate);
                expDate.setHours(0,0,0,0);
                const daysToExpiry = Math.ceil((expDate - today) / (1000 * 3600 * 24));
                const qty = parseInt(med.quantity);
                
                const processedMed = { ...med, daysToExpiry };

                // Priority Routing: Expired overrides Low Stock
                if (daysToExpiry < 0) {
                    expiredMeds.push(processedMed);
                } else if (qty < 5) {
                    lowStockMeds.push(processedMed);
                } else if (daysToExpiry <= 30) {
                    expiringMeds.push(processedMed);
                } else {
                    healthyMeds.push(processedMed);
                }
            });

            const sortLogic = (a, b) => a.daysToExpiry - b.daysToExpiry || a.quantity - b.quantity;
            expiredMeds.sort(sortLogic);
            lowStockMeds.sort(sortLogic);
            expiringMeds.sort(sortLogic);
            healthyMeds.sort(sortLogic);

            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' }); 
                
                const margin = 14;
                const pageWidth = doc.internal.pageSize.width;
                const brandColor = [10, 132, 255]; 
                let currentY = 20;

                // --- HEADER DESIGN ---
                doc.setFillColor(...brandColor);
                doc.rect(0, 0, pageWidth, 5, 'F');
                
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(24);
                doc.setTextColor(15, 23, 42);
                doc.text("Qubit | Meds", margin, currentY);
                
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.setTextColor(100, 116, 139);
                doc.text(`Medical Inventory Audit • Generated on ${new Date().toLocaleString()}`, margin, currentY + 6);
                currentY += 20;

                // --- 2. Five-Column KPI DASHBOARD ---
                const drawKPI = (x, y, w, title, val, color) => {
                    doc.setFillColor(248, 250, 252);
                    doc.rect(x, y, w, 22, 'F');
                    doc.setDrawColor(226, 232, 240);
                    doc.setLineWidth(0.5);
                    doc.rect(x, y, w, 22, 'S');
                    
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(7.5); // Slightly smaller font to fit 5 cards
                    doc.setTextColor(100, 116, 139);
                    doc.text(title.toUpperCase(), x + 4, y + 8);
                    
                    doc.setFontSize(16);
                    doc.setTextColor(...color);
                    doc.text(val.toString(), x + 4, y + 17);
                };

                // Dynamically calculate width for 5 cards with a 3.5mm gap
                const gap = 3.5;
                const cardW = (pageWidth - (margin * 2) - (gap * 4)) / 5;
                
                drawKPI(margin, currentY, cardW, "Total Tracked", inventory.length, [15, 23, 42]);
                drawKPI(margin + cardW + gap, currentY, cardW, "Expired", expiredMeds.length, [220, 38, 38]); // Deep Red
                drawKPI(margin + (cardW * 2) + (gap * 2), currentY, cardW, "Low Stock", lowStockMeds.length, [234, 88, 12]); // Orange
                drawKPI(margin + (cardW * 3) + (gap * 3), currentY, cardW, "Expiring Soon", expiringMeds.length, [245, 158, 11]); // Amber
                drawKPI(margin + (cardW * 4) + (gap * 4), currentY, cardW, "Healthy", healthyMeds.length, [16, 185, 129]); // Green
                
                currentY += 35;

                // --- 3. UPDATED TABLE COLUMNS ---
                const tableStyles = {
                    theme: 'grid',
                    styles: { font: 'helvetica', fontSize: 9, cellPadding: 4, textColor: [51, 65, 85], lineColor: [226, 232, 240], lineWidth: 0.1 },
                    headStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
                    margin: { left: margin, right: margin },
                    columnStyles: {
                        0: { fontStyle: 'bold', cellWidth: 42 },   // Brand
                        1: { cellWidth: 50 },                      // Formulation
                        2: { cellWidth: 35 },                      // Mfg
                        3: { cellWidth: 20 },                      // Type
                        4: { cellWidth: 15, halign: 'center' },    // Qty
                        5: { cellWidth: 30, fontStyle: 'bold' },   // Status (NEW)
                        6: { cellWidth: 'auto' }                   // Expiry
                    }
                };

                const formatRow = (med) => {
                    let statusStr = "Healthy";
                    let statusColor = [16, 185, 129]; // Default Green
                    
                    if (med.daysToExpiry < 0) {
                        statusStr = "Expired";
                    } else if (med.quantity < 5) {
                        statusStr = "Low Stock";
                    } else if (med.daysToExpiry <= 30) {
                        statusStr = "Expiring Soon";
                    }

                    return [
                        (med.brand || med.name || 'Unknown').toUpperCase(),
                        med.salts || '-',
                        med.manufacturer || '-',
                        med.type ? med.type.charAt(0).toUpperCase() + med.type.slice(1) : 'Pill',
                        med.quantity.toString(),
                        statusStr, // Independent Column
                        new Date(med.expiryDate).toLocaleDateString() // Independent Column
                    ];
                };

                const renderTable = (title, data, titleColor) => {
                    if (data.length === 0) return;
                    
                    if (currentY > 160) { doc.addPage(); currentY = 20; }
                    
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(11);
                    doc.setTextColor(...titleColor);
                    doc.text(title, margin, currentY);
                    
                    doc.autoTable({
                        startY: currentY + 4,
                        head: [['Brand / Medicine', 'Formulation', 'Manufacturer', 'Type', 'Qty', 'Status', 'Expiry Date']],
                        body: data.map(formatRow),
                        ...tableStyles,
                        // Optional: Dynamic text coloring for the status column
                        didParseCell: function(data) {
                            if (data.section === 'body' && data.column.index === 5) {
                                const status = data.cell.raw;
                                if (status === 'Expired') data.cell.styles.textColor = [220, 38, 38];
                                else if (status === 'Low Stock') data.cell.styles.textColor = [234, 88, 12];
                                else if (status === 'Expiring Soon') data.cell.styles.textColor = [245, 158, 11];
                                else data.cell.styles.textColor = [16, 185, 129];
                            }
                        }
                    });
                    currentY = doc.lastAutoTable.finalY + 15;
                };

                // Render the 4 independent tables
                renderTable("EXPIRED INVENTORY (Immediate Disposal)", expiredMeds, [220, 38, 38]);
                renderTable("LOW STOCK (Replenishment Required)", lowStockMeds, [234, 88, 12]);
                renderTable("EXPIRING SOON (Next 30 Days)", expiringMeds, [245, 158, 11]);
                renderTable("HEALTHY INVENTORY", healthyMeds, [16, 185, 129]);

                // --- FOOTER PAGINATION ---
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(148, 163, 184);
                    doc.text(`Qubit Meds • Inventory Audit`, margin, doc.internal.pageSize.height - 10);
                    doc.text(`Page ${i} of ${pageCount}`, pageWidth - margin, doc.internal.pageSize.height - 10, { align: 'right' });
                }

                doc.save(`Qubit_Inventory_Report_${today.toISOString().split('T')[0]}.pdf`);
                localStorage.removeItem('qubit_export_cache');
                
                window.history.back();

            }, 1200); 
        });
    </script>
</body>
</html>
